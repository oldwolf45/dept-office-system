services:
  api:
    build: ./backend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
      # 时区：镜像默认 UTC，不设会导致（1）所有 datetime('now','localtime') 早 8 小时
      # （2）自动备份窗口 03:00-04:00 实际在北京时间 11 点跑（3）todayDate() 取到 UTC 日期，
      # 凌晨 0-8 点开的单据编号会用到前一天日期。（镜像自带 zoneinfo，无需装 tzdata）
      TZ: ${TZ:-Asia/Shanghai}
      # 发行模式：不预置种子账号，0 账号时走网页引导（部署手册要求）。缺省会去 import 私有 seed-data.js 导致启动崩溃
      DISTRIBUTION_MODE: ${DISTRIBUTION_MODE:-1}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      # 8080 直连容器 443（HTTPS）。原因：阿里云安全组默认只放行 8080，80/443/8443 均不通，
      # 而 nginx 的 80 只做 301 跳 https://host:8443 —— 从公网访问会卡在跳转到不通的端口。
      # 安全组放行 8443 后，两条映射都可用；届时可只留 8443。
      - "8080:443"
      - "8443:443"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped
