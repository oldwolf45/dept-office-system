services:
  api:
    build: ./backend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs
    depends_on:
      - api
    restart: unless-stopped
